[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cochlear-implant-reconstruction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "ultralytics",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "electrode_detection*",
    "electrode_segmentation*",
    "video*",
]
