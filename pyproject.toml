[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "electrode-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "ultralytics",
]

[tool.setuptools.packages.find]
where = ["src"]